services:
  postgres:
    image: postgres:16-alpine
    container_name: vegah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vegah-network

  redis:
    image: redis:7-alpine
    container_name: vegah-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vegah-network

  backend:
    image: ${IMAGE_BACKEND:-vegah-backend}
    container_name: vegah-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vegah-network

  worker:
    image: ${IMAGE_WORKER:-vegah-worker}
    container_name: vegah-worker
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vegah-network

  frontend:
    image: ${IMAGE_FRONTEND:-vegah-frontend}
    container_name: vegah-frontend
    restart: unless-stopped
    environment:
      INTERNAL_BACKEND_URL: http://backend:4000
      PORT: 3000
    ports:
      - "80:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vegah-network

volumes:
  postgres_data:
  redis_data:

networks:
  vegah-network:
    driver: bridge

